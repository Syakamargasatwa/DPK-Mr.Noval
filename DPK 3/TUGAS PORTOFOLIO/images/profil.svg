<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 10" shape-rendering="crispEdges">
  <rect width="8" height="10" fill="#87ceeb"/>
  <!-- Wajah -->
  <rect x="1" y="0" width="6" height="6" fill="#b9835b"/>
  <!-- Rambut -->
  <rect x="1" y="0" width="6" height="2" fill="#1c1c24"/>
  <rect x="1" y="2" width="1" height="1" fill="#1c1c24"/>
  <rect x="6" y="2" width="1" height="1" fill="#1c1c24"/>
  <!-- Mata -->
  <rect x="2" y="3" width="1" height="1" fill="#1c1c24"/>
  <rect x="5" y="3" width="1" height="1" fill="#1c1c24"/>
  <!-- Senyum -->
  <rect x="3" y="5" width="2" height="1" fill="#7a4a2e"/>
  <!-- Leher dan baju -->
  <rect x="3" y="6" width="2" height="1" fill="#b9835b"/>
  <rect x="0" y="7" width="8" height="3" fill="#2a9d8f"/>
  <rect x="3" y="7" width="2" height="1" fill="#1f7a6f"/>
</svg>
